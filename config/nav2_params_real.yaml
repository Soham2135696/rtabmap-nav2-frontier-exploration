# Nav2 parameters for the real rover (D435i). Simulation uses nav2_params.yaml.
# Loaded by: ros2 launch depth nav2.launch.py mode:=real

planner_server:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false

    controller_frequency: 10.0

    controller_plugins: ["FollowPath"]

    goal_checker_plugins: ["general_goal_checker"]
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
         plugin: "dwb_core::DWBLocalPlanner"

         min_vel_x: 0.0
         max_vel_x: 0.15

         max_vel_theta: 0.3   # slow turns keep visual odometry tracking

         min_speed_xy: 0.0
         max_speed_xy: 0.15
         min_speed_theta: 0.0

         acc_lim_x: 1.0
         acc_lim_y: 0.0
         acc_lim_theta: 1.5

         decel_lim_x: -1.5
         decel_lim_y: 0.0
         decel_lim_theta: -2.0

         vx_samples: 20
         vy_samples: 1
         vtheta_samples: 20

         sim_time: 1.7

         xy_goal_tolerance: 0.25
         trans_stopped_velocity: 0.1

         short_circuit_trajectory_evaluation: true
         stateful: true

         critics:
             - RotateToGoal
             - Oscillation
             - BaseObstacle
             - GoalAlign
             - PathAlign
             - PathDist
             - GoalDist

         BaseObstacle.scale: 2.0
         PathAlign.scale: 32.0
         PathDist.scale: 32.0
         GoalAlign.scale: 24.0
         GoalDist.scale: 24.0
         RotateToGoal.scale: 32.0

behavior_server:
  ros__parameters:
    use_sim_time: false
    # Spin recoveries publish /cmd_vel directly, bypassing DWB and velocity_smoother.
    # Nav2 defaults (1.0 rad/s, 3.2 rad/s^2) would break visual odometry tracking
    max_rotational_vel: 0.3     # = FollowPath.max_vel_theta
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.5     # = FollowPath.acc_lim_theta

bt_navigator:
  ros__parameters:
    use_sim_time: false

waypoint_follower:
  ros__parameters:
    use_sim_time: false

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    # Hard cap matching DWB limits (Nav2 defaults are 0.5 m/s, 2.0 rad/s)
    max_velocity: [0.15, 0.0, 0.3]
    min_velocity: [-0.15, 0.0, -0.3]

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false

      global_frame: map
      robot_base_frame: base_link

      transform_tolerance: 1.0

      update_frequency: 2.0
      publish_frequency: 2.0

      resolution: 0.05

      track_unknown_space: true
      rolling_window: false

      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /rtabmap/map
        subscribe_to_updates: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: depth_cloud

        tf_filter_tolerance: 1.0

        # Downsampled D435i cloud from real_sensors.launch.py (point_cloud_xyz).
        # Heights are filtered in this costmap's global frame (floor = 0).
        # D435i sees nothing closer than ~0.3 m and gets noisy beyond ~3 m.
        depth_cloud:
          topic: /camera/obstacle_cloud
          data_type: PointCloud2
          marking: true
          clearing: true
          obstacle_max_range: 2.5
          raytrace_max_range: 3.5
          obstacle_min_range: 0.3
          raytrace_min_range: 0.3
          min_obstacle_height: 0.1
          max_obstacle_height: 0.8

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 2.0

      # From rover.urdf; TODO remeasure on the real rover
      footprint: "[[0.23, 0.19], [0.23, -0.19], [-0.27, -0.19], [-0.27, 0.19]]"
      footprint_padding: 0.02


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false

      global_frame: odom
      robot_base_frame: base_link

      update_frequency: 5.0
      publish_frequency: 5.0

      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05

      transform_tolerance: 1.0

      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: depth_cloud

        tf_filter_tolerance: 1.0

        # Downsampled D435i cloud from real_sensors.launch.py (point_cloud_xyz).
        # Heights are filtered in this costmap's global frame (floor = 0).
        # D435i sees nothing closer than ~0.3 m and gets noisy beyond ~3 m.
        depth_cloud:
          topic: /camera/obstacle_cloud
          data_type: PointCloud2
          marking: true
          clearing: true
          obstacle_max_range: 2.5
          raytrace_max_range: 3.5
          obstacle_min_range: 0.3
          raytrace_min_range: 0.3
          min_obstacle_height: 0.1
          max_obstacle_height: 0.8

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 2.0

      # From rover.urdf; TODO remeasure on the real rover
      footprint: "[[0.23, 0.19], [0.23, -0.19], [-0.27, -0.19], [-0.27, 0.19]]"
      footprint_padding: 0.02
