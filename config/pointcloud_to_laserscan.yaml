pointcloud_to_laserscan:
  ros__parameters:
    use_sim_time: true

    # Heights are measured in target_frame (base_link), not the camera frame.
    # Floor is at z ~ -0.10 in base_link, maze walls are 1.2 m tall.
    target_frame: base_link
    transform_tolerance: 0.1
    min_height: 0.0
    max_height: 0.6

    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.01745
    scan_time: 0.1
    range_min: 0.1
    range_max: 4.0
    use_inf: true
